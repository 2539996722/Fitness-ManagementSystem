<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告管理 · FitHub 管理后台</title>
    <link rel="stylesheet" href="css/soft-ui.css">
    <style>
        /* —— 页面私有（共享部分见 soft-ui.css） —— */
        .bn-card { background: var(--bg-0); border-radius: var(--r-md); box-shadow: var(--shadow-out-sm); padding: var(--sp-4); margin-bottom: var(--sp-4); }
        .bn-card__title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: var(--sp-3); display: flex; align-items: center; justify-content: space-between; }
        .bn-card__title-meta { font-size: 12px; color: var(--text-muted); font-weight: 400; }
        .bn-filters { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: flex-end; }
        .bn-filter { display: flex; flex-direction: column; gap: 4px; }
        .bn-filter__label { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
        .bn-input { padding: 7px 10px; border-radius: var(--r-sm); border: 1px solid rgba(163,177,198,0.3); font-size: 13px; background: var(--bg-0); color: var(--text); box-shadow: var(--shadow-in-sm); transition: all var(--t-base); }
        .bn-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .bn-input--narrow { max-width: 180px; }
        .bn-checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
        .bn-btn { padding: 7px 14px; border-radius: var(--r-sm); border: none; background: var(--bg-2); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-flat); transition: all var(--t-base); }
        .bn-btn:hover { box-shadow: var(--shadow-out-sm); }
        .bn-btn--primary { background: var(--accent); color: white; }
        .bn-btn--danger { background: #ef4444; color: white; }
        .bn-btn--ghost { background: transparent; box-shadow: none; color: var(--text-muted); }
        .bn-btn--sm { padding: 5px 10px; font-size: 12px; }

        /* 表格 */
        .bn-table-wrap { overflow-x: auto; border-radius: var(--r-md); box-shadow: var(--shadow-in-sm); }
        .bn-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        .bn-table th { background: var(--bg-2); text-align: left; padding: 10px 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.6px; white-space: nowrap; }
        .bn-table td { padding: 12px; border-bottom: 1px solid rgba(163, 177, 198, 0.18); vertical-align: middle; }
        .bn-table tbody tr:last-child td { border-bottom: none; }

        .bn-empty { text-align: center; padding: var(--sp-5); color: var(--text-muted); }
        .bn-badge { display: inline-block; padding: 2px 8px; border-radius: var(--r-pill); font-size: 11px; font-weight: 700; }
        .bn-badge--active { background: var(--success-soft); color: var(--success); }
        .bn-badge--inactive { background: var(--bg-2); color: var(--text-muted); }
        .bn-title { font-weight: 700; color: var(--text); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bn-content { max-width: 320px; color: var(--text-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bn-link { color: var(--accent); font-size: 12px; text-decoration: none; }
        .bn-link:hover { text-decoration: underline; }
        .bn-sort { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text-muted); }

        /* 模态框 */
        .bn-modal-mask { position: fixed; inset: 0; background: rgba(45, 55, 72, 0.45); backdrop-filter: blur(4px); z-index: 100; display: none; }
        .bn-modal-mask--open { display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
        .bn-modal { background: var(--bg-0); border-radius: var(--r-lg); box-shadow: var(--shadow-out-lg); width: 540px; max-width: 92vw; max-height: 90vh; overflow-y: auto; }
        .bn-modal__head { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid rgba(163,177,198,0.2); display: flex; align-items: center; justify-content: space-between; }
        .bn-modal__title { font-size: 17px; font-weight: 700; }
        .bn-modal__close { background: transparent; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; width: 28px; height: 28px; border-radius: var(--r-pill); }
        .bn-modal__close:hover { background: var(--bg-2); color: var(--text); }
        .bn-modal__body { padding: var(--sp-5); }
        .bn-modal__footer { padding: var(--sp-3) var(--sp-5); border-top: 1px solid rgba(163,177,198,0.2); display: flex; justify-content: flex-end; gap: var(--sp-2); }
        .bn-form-row { margin-bottom: var(--sp-3); }
        .bn-form-row__label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
        .bn-form-row__hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; opacity: 0.7; }
        .bn-form-row textarea { width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid rgba(163,177,198,0.3); background: var(--bg-0); color: var(--text); font-size: 13px; font-family: inherit; resize: vertical; min-height: 80px; box-shadow: var(--shadow-in-sm); }
        .bn-form-row textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .bn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }

        /* alert */
        .alert { padding: 10px 14px; border-radius: var(--r-sm); margin-bottom: var(--sp-3); font-size: 13px; box-shadow: var(--shadow-out-sm); transition: opacity 0.2s; }
        .alert--success { background: var(--success-soft); color: var(--success); }
        .alert--error { background: #fee2e2; color: #dc2626; }
        .alert--hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <aside id="appSidebar" class="sidebar sidebar--admin"></aside>
    <main class="main">
        <header class="main__header">
            <h1 class="main__title">📢 公告管理</h1>
            <div class="main__user">
                <span id="userName" class="main__user-name"></span>
                <span id="userRole" class="main__user-role"></span>
                <button id="logoutBtn" class="main__logout">退出</button>
            </div>
        </header>

        <div id="alert" class="alert alert--hidden"></div>

        <section id="root">
            <div class="bn-empty">加载中...</div>
        </section>
    </main>

<script type="module" src="js/admin-layout.js"></script>
<script type="module" src="js/banners-admin.js"></script>
</body>
</html>
