<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>操作日志 · FitHub 管理后台</title>
    <link rel="stylesheet" href="css/soft-ui.css">
    <style>
        /* —— 页面私有（共享部分见 soft-ui.css） —— */
        .filters { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-label { font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.3px; }
        .form-input--narrow { max-width: 200px; }
        /* 表格 */
        .table-wrap { overflow-x: auto; border-radius: var(--r-md); box-shadow: var(--shadow-out-sm); padding: var(--sp-2); background: var(--bg-0); }
        table.data { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        table.data th { background: var(--bg-2); text-align: left; padding: 10px 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.6px; white-space: nowrap; }
        table.data td { padding: 12px; border-bottom: 1px solid rgba(163, 177, 198, 0.18); vertical-align: middle; }
        table.data tbody tr { cursor: pointer; }
        table.data tbody tr:hover td { background: var(--bg-1); }
        table.data tbody tr:last-child td { border-bottom: none; }
        /* 时间列 */
        .cell-time { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-muted); font-size: 12px; }
        .cell-time__ago { font-size: 11px; color: var(--text-muted); opacity: 0.7; }
        /* 角色徽标 */
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--r-pill);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        .role-badge--admin { background: var(--accent-soft); color: var(--accent); }
        .role-badge--trainer { background: var(--success-soft); color: var(--success); }
        .role-badge--system { background: var(--bg-2); color: var(--text-muted); }
        /* 动作徽标 */
        .action-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--r-sm);
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-2);
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }
        /* 摘要 */
        .summary { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* IP 列 */
        .ip-cell { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; color: var(--text-muted); }
        /* 抽屉 */
        .drawer-mask { position: fixed; inset: 0; background: rgba(45, 55, 72, 0.45); backdrop-filter: blur(4px); z-index: 100; display: none; }
        .drawer-mask--open { display: block; animation: fadeIn 0.2s ease; }
        .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 640px; max-width: 100vw; background: var(--bg-0); box-shadow: var(--shadow-out-lg); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 101; overflow-y: auto; border-radius: var(--r-lg) 0 0 var(--r-lg); }
        .drawer--open { transform: translateX(0); }
        .drawer__head { padding: var(--sp-5); border-bottom: 1px solid rgba(163, 177, 198, 0.2); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-0); z-index: 1; }
        .drawer__title { font-size: 18px; font-weight: 700; }
        .drawer__close { background: var(--bg-0); border: none; width: 32px; height: 32px; border-radius: var(--r-pill); cursor: pointer; color: var(--text-muted); box-shadow: var(--shadow-flat); font-size: 18px; transition: all var(--t-base); }
        .drawer__close:hover { color: var(--accent); box-shadow: var(--shadow-out-sm); }
        .drawer__body { padding: var(--sp-5); }
        .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px var(--sp-3); font-size: 13px; }
        .kv__k { color: var(--text-muted); font-weight: 500; }
        .kv__v { color: var(--text); word-break: break-all; font-family: inherit; }
        .kv__v--mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
        .json-box {
            background: var(--bg-2);
            padding: var(--sp-3);
            border-radius: var(--r-md);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: var(--shadow-in-sm);
        }
        /* 分页 */
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: var(--sp-4); font-size: 13px; color: var(--text-muted); }
        .pagination__btns { display: flex; gap: var(--sp-2); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .empty { text-align: center; padding: var(--sp-6); color: var(--text-muted); }
    </style>
    <script type="module" src="js/admin-layout.js"></script>
</head>
<body>
    <aside class="sidebar" id="appSidebar"></aside>

    <main class="main">
        <div class="header">
            <div class="header__title">📜 操作日志</div>
            <div class="header__user">
                <span class="header__role" id="userRole">-</span>
                <span id="userName">-</span>
                <button class="header__btn" id="logoutBtn">退出登录</button>
            </div>
        </div>

        <div id="alert" class="alert alert--hidden"></div>

        <!-- 筛选 -->
        <div class="card">
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">动作</label>
                    <select id="fAction" class="form-select form-input--narrow">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">对象类型</label>
                    <select id="fTargetType" class="form-select form-input--narrow">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">操作人 ID</label>
                    <input id="fOperatorId" type="number" min="1" class="form-input form-input--narrow" placeholder="如 1001">
                </div>
                <div class="filter-group">
                    <label class="filter-label">关键词（摘要）</label>
                    <input id="fKeyword" class="form-input form-input--narrow" placeholder="如 封禁 / 模板 3">
                </div>
                <div class="filter-group">
                    <label class="filter-label">起始</label>
                    <input id="fFrom" type="date" class="form-input form-input--narrow">
                </div>
                <div class="filter-group">
                    <label class="filter-label">截止</label>
                    <input id="fTo" type="date" class="form-input form-input--narrow">
                </div>
                <button class="btn btn--primary" id="btnSearch">🔍 查询</button>
                <button class="btn btn--ghost" id="btnReset">重置</button>
            </div>
        </div>

        <!-- 列表 -->
        <div class="card">
            <div class="card__title">
                📜 操作日志
                <span id="totalLabel" style="font-weight: normal; font-size: 13px; color: var(--color-text-muted);"></span>
            </div>
            <div class="table-wrap">
                <table class="data">
                    <thead>
                        <tr>
                            <th style="width: 150px;">时间</th>
                            <th style="width: 120px;">操作人</th>
                            <th style="width: 90px;">动作</th>
                            <th style="width: 90px;">对象</th>
                            <th>摘要</th>
                            <th style="width: 130px;">IP</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr><td colspan="6" class="empty">加载中…</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <span id="pageInfo">第 1 页 / 共 0 条</span>
                <div class="pagination__btns">
                    <button class="btn btn--sm" id="btnPrev">← 上一页</button>
                    <button class="btn btn--sm" id="btnNext">下一页 →</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 详情抽屉 -->
    <div class="drawer-mask" id="drawerMask"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer__head">
            <div class="drawer__title">日志详情</div>
            <button class="drawer__close" id="drawerClose">✕</button>
        </div>
        <div class="drawer__body" id="drawerBody">加载中…</div>
    </aside>

    <script type="module">
        const API_BASE = '/api/v1';
        const TOKEN_KEY = 'fithub_admin_access';
        const USER_KEY = 'fithub_admin_user';

        // ============ 鉴权 ============
        const user = JSON.parse(localStorage.getItem(USER_KEY) || 'null');
        if (!localStorage.getItem(TOKEN_KEY) || !user) {
            window.location.href = '/admin/login.html';
        }
        if (user?.role !== 'admin') {
            alert('仅管理员可访问此页面');
            window.location.href = '/admin/';
        }

        // ============ API ============
        async function api(path) {
            const headers = {};
            const token = localStorage.getItem(TOKEN_KEY);
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const resp = await fetch(`${API_BASE}${path}`, { headers });
            if (resp.status === 401) {
                localStorage.clear();
                window.location.href = '/admin/login.html';
                return;
            }
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({ detail: resp.statusText }));
                throw new Error(err.detail || `HTTP ${resp.status}`);
            }
            return resp.json();
        }

        // ============ 工具 ============
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        function showAlert(msg, type = 'info') {
            const el = $('#alert');
            el.className = `alert alert--${type}`;
            el.textContent = msg;
            el.classList.remove('alert--hidden');
            if (type === 'success') setTimeout(() => el.classList.add('alert--hidden'), 3500);
        }

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"']/g, (c) =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]),
            );
        }

        function formatTime(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        const ROLE_LABEL = { admin: '管理员', trainer: '教练', system: '系统' };
        const ROLE_CLASS = { admin: 'role-badge--admin', trainer: 'role-badge--trainer', system: 'role-badge--system' };

        // ============ 状态 ============
        const state = { offset: 0, limit: 30, total: 0, items: [] };

        // ============ 加载动作 / 对象类型下拉 ============
        async function loadFilterOptions() {
            try {
                const [actions, types] = await Promise.all([
                    api('/admin/operation-logs/actions'),
                    api('/admin/operation-logs/target-types'),
                ]);
                const aSel = $('#fAction');
                actions.forEach((a) => {
                    const opt = document.createElement('option');
                    opt.value = a.action;
                    opt.textContent = `${a.action}（${a.count}）`;
                    aSel.appendChild(opt);
                });
                const tSel = $('#fTargetType');
                types.forEach((t) => {
                    const opt = document.createElement('option');
                    opt.value = t.target_type;
                    opt.textContent = `${t.target_type}（${t.count}）`;
                    tSel.appendChild(opt);
                });
            } catch (e) {
                console.warn('加载筛选下拉失败：', e);
            }
        }

        // ============ 列表加载 ============
        function buildQuery() {
            const params = new URLSearchParams();
            const action = $('#fAction').value.trim();
            const targetType = $('#fTargetType').value.trim();
            const operatorId = $('#fOperatorId').value.trim();
            const keyword = $('#fKeyword').value.trim();
            const from = $('#fFrom').value;
            const to = $('#fTo').value;
            if (action) params.set('action', action);
            if (targetType) params.set('target_type', targetType);
            if (operatorId) params.set('operator_id', operatorId);
            if (keyword) params.set('keyword', keyword);
            if (from) params.set('date_from', `${from}T00:00:00`);
            if (to) params.set('date_to', `${to}T23:59:59`);
            params.set('limit', state.limit);
            params.set('offset', state.offset);
            return params.toString();
        }

        async function loadLogs() {
            try {
                const data = await api(`/admin/operation-logs?${buildQuery()}`);
                state.items = data.items || [];
                state.total = data.total || 0;
                renderTable();
            } catch (e) {
                showAlert('加载日志失败：' + e.message, 'error');
                $('#tbody').innerHTML = `<tr><td colspan="6" class="empty">加载失败</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = $('#tbody');
            $('#totalLabel').textContent = `（共 ${state.total} 条）`;
            const page = Math.floor(state.offset / state.limit) + 1;
            const totalPages = Math.max(1, Math.ceil(state.total / state.limit));
            $('#pageInfo').textContent = `第 ${page} 页 / 共 ${totalPages} 页（${state.total} 条）`;
            $('#btnPrev').disabled = state.offset <= 0;
            $('#btnNext').disabled = page >= totalPages;

            if (state.items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
                return;
            }

            tbody.innerHTML = state.items.map((it) => {
                const roleCls = ROLE_CLASS[it.operator_role] || 'role-badge--system';
                const roleLabel = ROLE_LABEL[it.operator_role] || (it.operator_role || '未知');
                return `<tr data-id="${it.id}">
                    <td class="cell-time">${escapeHtml(formatTime(it.created_at))}</td>
                    <td>
                        <div>${escapeHtml(it.operator_name || '-')}${it.operator_id ? ` <span style="color:var(--text-muted);font-size:11px;">#${it.operator_id}</span>` : ''}</div>
                        <span class="role-badge ${roleCls}">${escapeHtml(roleLabel)}</span>
                    </td>
                    <td><span class="action-badge">${escapeHtml(it.action)}</span></td>
                    <td>${escapeHtml(it.target_type || '-')}${it.target_id ? ` <span style="color:var(--text-muted);font-size:11px;">#${escapeHtml(it.target_id)}</span>` : ''}</td>
                    <td><div class="summary" title="${escapeHtml(it.summary || '')}">${escapeHtml(it.summary || '-')}</div></td>
                    <td class="ip-cell">${escapeHtml(it.ip || '-')}</td>
                </tr>`;
            }).join('');

            // 行点击 → 抽屉
            $$('#tbody tr[data-id]').forEach((tr) => {
                tr.addEventListener('click', () => {
                    const id = parseInt(tr.dataset.id, 10);
                    const item = state.items.find((x) => x.id === id);
                    if (item) openDrawer(item);
                });
            });
        }

        // ============ 抽屉 ============
        const drawer = $('#drawer');
        const drawerMask = $('#drawerMask');

        function openDrawer(item) {
            $('#drawerBody').innerHTML = `
                <div class="kv" style="margin-bottom: var(--sp-5);">
                    <div class="kv__k">时间</div><div class="kv__v kv__v--mono">${escapeHtml(formatTime(item.created_at))}</div>
                    <div class="kv__k">操作人</div><div class="kv__v">${escapeHtml(item.operator_name || '-')}${item.operator_id ? `（ID: ${item.operator_id}）` : ''}</div>
                    <div class="kv__k">角色</div><div class="kv__v">${escapeHtml(ROLE_LABEL[item.operator_role] || item.operator_role || '系统')}</div>
                    <div class="kv__k">动作</div><div class="kv__v"><span class="action-badge">${escapeHtml(item.action)}</span></div>
                    <div class="kv__k">对象类型</div><div class="kv__v">${escapeHtml(item.target_type || '-')}</div>
                    <div class="kv__k">对象 ID</div><div class="kv__v kv__v--mono">${escapeHtml(item.target_id || '-')}</div>
                    <div class="kv__k">IP</div><div class="kv__v kv__v--mono">${escapeHtml(item.ip || '-')}</div>
                    <div class="kv__k">摘要</div><div class="kv__v">${escapeHtml(item.summary || '-')}</div>
                </div>
                <h4 style="font-size: 13px; color: var(--text-muted); margin-bottom: var(--sp-2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;">Details（变更详情）</h4>
                <div class="json-box">${escapeHtml(item.details ? JSON.stringify(item.details, null, 2) : '（无）')}</div>
            `;
            drawer.classList.add('drawer--open');
            drawerMask.classList.add('drawer-mask--open');
        }

        function closeDrawer() {
            drawer.classList.remove('drawer--open');
            drawerMask.classList.remove('drawer-mask--open');
        }

        $('#drawerClose').addEventListener('click', closeDrawer);
        drawerMask.addEventListener('click', closeDrawer);

        // ============ 事件 ============
        $('#btnSearch').addEventListener('click', () => { state.offset = 0; loadLogs(); });
        $('#btnReset').addEventListener('click', () => {
            $('#fAction').value = '';
            $('#fTargetType').value = '';
            $('#fOperatorId').value = '';
            $('#fKeyword').value = '';
            $('#fFrom').value = '';
            $('#fTo').value = '';
            state.offset = 0;
            loadLogs();
        });
        $('#btnPrev').addEventListener('click', () => {
            if (state.offset <= 0) return;
            state.offset -= state.limit;
            loadLogs();
        });
        $('#btnNext').addEventListener('click', () => {
            if (state.offset + state.limit >= state.total) return;
            state.offset += state.limit;
            loadLogs();
        });

        // ESC 关抽屉
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

        // ============ 启动 ============
        await loadFilterOptions();
        await loadLogs();
    </script>
</body>
</html>
