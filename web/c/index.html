<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHub · 健身动作库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="navbar">
        <div class="navbar__brand">
            <span class="navbar__logo">💪</span>
            <span class="navbar__title">FitHub</span>
        </div>
        <nav class="navbar__nav">
            <a href="/c/" class="navbar__link navbar__link--active">动作库</a>
            <a href="/c/plans.html" class="navbar__link">训练计划</a>
            <a href="/c/templates.html" class="navbar__link">模板市场</a>
            <a href="/c/profile.html" class="navbar__link" data-requires-auth>个人中心</a>
        </nav>
        <div class="navbar__auth">
            <a href="/admin/login.html" class="btn btn--ghost" title="进入管理后台">⚙️ 后台</a>
            <a href="/c/login.html" class="btn btn--ghost" id="navLogin">登录</a>
            <a href="/c/register.html" class="btn btn--primary" id="navRegister">注册</a>
            <button class="btn btn--ghost" id="navLogout" style="display:none">退出</button>
        </div>
    </header>

    <!-- 公告 Banner（M9，从 /api/v1/banners/active 拉取） -->
    <section id="bannerStrip" class="banner-strip" aria-label="公告"></section>

    <!-- 主体 -->
    <main class="main">
        <!-- 筛选侧栏 -->
            <aside class="sidebar">
                <div class="sidebar__group">
                    <label class="sidebar__label">搜索</label>
                    <input type="search" id="searchInput" class="input" placeholder="动作名（中/英）">
                </div>

                <div class="sidebar__group">
                    <label class="sidebar__label">身体部位</label>
                    <select id="filterBodyPart" class="input">
                        <option value="">全部</option>
                    </select>
                </div>

                <div class="sidebar__group">
                    <label class="sidebar__label">器械</label>
                    <select id="filterEquipment" class="input">
                        <option value="">全部</option>
                    </select>
                </div>

                <div class="sidebar__group">
                    <label class="sidebar__label">目标肌肉</label>
                    <select id="filterTarget" class="input">
                        <option value="">全部</option>
                    </select>
                </div>

                <button class="btn btn--secondary" id="resetFilters">重置筛选</button>
            </aside>

            <!-- 内容区 -->
            <section class="content">
                <div class="content__header">
                    <h1 class="content__title">健身动作库</h1>
                    <div class="content__meta" id="resultMeta">加载中...</div>
                </div>

                <div class="grid" id="exerciseGrid">
                    <!-- 卡片由 JS 渲染 -->
                </div>

                <div class="content__more">
                    <button class="btn btn--secondary" id="loadMore" style="display:none">加载更多</button>
                </div>
            </section>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>© Gym visual · <a href="https://gymvisual.com/" target="_blank" rel="noopener">动作媒体来源</a></p>
            <p>FitHub · v0.1.0</p>
        </footer>

        <script type="module" src="js/app.js"></script>
        <script type="module" src="js/banner.js"></script>
    </body>
</html>
