# ============================================
# FitHub 前端 Nginx 配置
# ============================================
# 由 docker-compose 挂载到 /etc/nginx/conf.d/default.conf
# ============================================

# 上游：FastAPI 后端
upstream fithub_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 字符集与日志
    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 客户端上传大小（与后端 UPLOAD_MAX_SIZE_MB 一致）
    client_max_body_size 10M;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 根路径：C 端首页 ----------
    root /usr/share/nginx/html;
    index index.html;

    # C 端 SPA 路由 fallback
    location / {
        try_files $uri $uri/ /c/index.html;
    }

    # B 端 SPA 路由 fallback
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://fithub_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;

        # CORS 头（如后端未配置则这里补）
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

        # OPTIONS 预检直接返回
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ---------- 后端静态资源（动作 GIF / 缩略图）----------
    location /static/ {
        proxy_pass http://fithub_backend/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---------- OpenAPI 文档 ----------
    location /docs {
        proxy_pass http://fithub_backend/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://fithub_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # ---------- 健康检查 ----------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- 错误页 ----------
    error_page 404 /c/index.html;
    error_page 500 502 503 504 /c/index.html;
}