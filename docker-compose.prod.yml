# ============================================
# FitHub 生产环境 Docker Compose
# ============================================
# 与 docker-compose.yml 的差异：
#   - Backend 去掉代码热挂载 volume（./backend:/app）
#   - Backend 默认 workers=4（生产并发）
#   - DEBUG 默认 false
#   - APP_ENV 默认 production
#   - 健康检查更严格
#
# 启动：
#   docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 停止：
#   docker-compose -f docker-compose.prod.yml down
# 清理（含数据）：
#   docker-compose -f docker-compose.prod.yml down -v
# ============================================

services:

  mysql:
    image: mysql:8.0
    container_name: fithub-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-fithub}
      MYSQL_USER: ${MYSQL_USER:-fithub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-500}
      - --slow-query-log=ON
      - --long-query-time=1
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"   # 只绑本机（外部走 nginx）
    volumes:
      - mysql_prod_data:/var/lib/mysql
      # 首次启动注入 SQL（如果用 initdb）：
      # - ./backend/alembic:/docker-entrypoint-initdb.d/alembic:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - fithub-net
    # ⚠️ 生产建议：暴露给外部时改用 unix socket 或 private network

  redis:
    image: redis:7-alpine
    container_name: fithub-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEM:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fithub-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fithub-backend-prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 强制生产
      APP_ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai

      # 数据库
      MYSQL_DSN: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DB}?charset=utf8mb4

      # JWT（必须 32+ 字符随机）
      JWT_SECRET: ${JWT_SECRET:?必须设置 JWT_SECRET（openssl rand -hex 32）}
      JWT_ALGORITHM: HS256

      # 默认管理员（生产前必改）
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?必须设置}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?必须设置}

      # CORS（域名白名单）
      CORS_ORIGINS: ${CORS_ORIGINS:?必须设置 CORS_ORIGINS}

      # LLM
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:?必须设置 LLM_API_KEY}
      LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-gpt-4o-mini}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Chroma（容器内持久化路径）
      CHROMA_PERSIST_DIR: /app/data/chroma

      # 数据
      EXERCISES_DATA_DIR: /app/data/exercises-dataset-zh

      # 限流
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_AI_PER_USER_PER_DAY: ${RATE_LIMIT_AI_PER_USER_PER_DAY:-50}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # 仅持久化 data 目录，代码走镜像
      - backend_prod_data:/app/data
      # 动作数据集（如已 clone 到主机）
      - ${HOST_EXERCISES_DIR:-./data/exercises-dataset-zh}:/app/data/exercises-dataset-zh:ro
    # 生产 workers（uvicorn 单进程 → 多进程）
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${BACKEND_WORKERS:-4}"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-2.0}'
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
    networks:
      - fithub-net

  frontend:
    image: nginx:1.25-alpine
    container_name: fithub-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fithub-net

networks:
  fithub-net:
    driver: bridge

volumes:
  mysql_prod_data:
  redis_prod_data:
  backend_prod_data:
